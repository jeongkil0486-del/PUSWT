<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TAS Walkie-Talkie">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="TAS Walkie-Talkie">
    <link rel="apple-touch-icon" href="assets/app-icon.png">
    <link rel="icon" sizes="192x192" href="assets/app-icon.png">
    <title>TAS Walkie-Talkie</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="css/style.css?v=20260708-ui-8">
</head>
<body>

<div id="alarm-overlay">
    <div class="alarm-overlay-title">퇴근</div>
    <div>업무 종료!<br>번호를 즉시 반납해주세요.</div>
    <div class="alarm-overlay-sub">화면을 터치하면 알림이 꺼집니다.</div>
</div>

<div id="app-container">
    <div id="login-screen" class="screen login-screen">
        <div class="login-screen-bg">
            <div class="login-photo-bg"></div>
            <div class="login-photo-overlay"></div>
            <div class="login-curve login-curve-left"></div>
            <div class="login-curve login-curve-right"></div>
            <div class="login-curve login-curve-bottom"></div>
        </div>

        <div class="login-hero">
            <div class="brand-mark">
                <img src="assets/app-icon.png" alt="TAS Walkie-Talkie 로고">
            </div>

            <div class="login-brand">
                <div class="brand-wordmark">
                    <h1>TAS</h1>
                    <span class="brand-swoosh" aria-hidden="true"></span>
                    <span class="brand-plane" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M3 13.5l18-6.5-5 6 5 3-2 .8-5-1.5-4.2 3.2-1.3-.4 2.1-3.8-4.6-1.3z" fill="currentColor"></path>
                        </svg>
                    </span>
                </div>
                <p>Walkie-Talkie</p>
            </div>
        </div>

        <div class="login-card">
            <div class="field-group">
                <label class="field-label" for="branch-select">지점 선택</label>
                <div class="control-row select-row">
                    <span class="control-balance" aria-hidden="true"></span>
                    <span class="control-body control-body-centered">
                        <span class="control-content control-content-select">
                            <span id="branch-select-display" class="control-input control-display" aria-hidden="true"></span>
                        </span>
                    </span>
                    <select id="branch-select" class="control-native-select" aria-label="지점 선택"></select>
                    <span class="control-trailing control-chevron" aria-hidden="true">
                        <svg viewBox="0 0 24 24">
                            <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
                        </svg>
                    </span>
                </div>
            </div>

            <div class="field-group">
                <label class="sr-only" for="login-id">ID</label>
                <div class="control-row">
                    <span class="control-balance" aria-hidden="true"></span>
                    <span class="control-body control-body-centered">
                        <span class="control-content control-content-id">
                            <input type="text" id="login-id" class="control-input control-input-centered control-input-id login-input" placeholder="ID" data-base-length="2">
                        </span>
                    </span>
                    <span class="control-trailing control-trailing-blank" aria-hidden="true"></span>
                </div>
            </div>

            <div class="field-group">
                <label class="sr-only" for="login-pw">Password</label>
                <div class="control-row">
                    <span class="control-balance" aria-hidden="true"></span>
                    <span class="control-body control-body-centered">
                        <span class="control-content control-content-password">
                            <input type="password" id="login-pw" class="control-input control-input-centered control-input-password login-input" placeholder="Password" data-base-length="8">
                        </span>
                    </span>
                    <button type="button" id="btn-toggle-password" class="control-trailing control-trailing-eye password-toggle" aria-label="비밀번호 보기 전환">
                        <svg viewBox="0 0 24 24">
                            <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path>
                            <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"></circle>
                        </svg>
                    </button>
                </div>
            </div>

            <button id="btn-login" class="btn btn-login-primary">로그인</button>
            <button id="btn-user-reset-req" class="btn login-secondary-action">비밀번호 초기화 요청</button>
        </div>

        <div class="login-version">TAS Walkie-Talkie</div>
    </div>

    <div id="main-screen" class="screen hidden">
        <header>
            <div class="header-stack">
                <span id="user-greeting">환영합니다</span>
                <span id="main-branch-badge" class="branch-pill">PUS</span>
            </div>
            <button id="btn-logout" class="btn btn-secondary">로그아웃</button>
        </header>
        <div class="screen-body">
            <div class="controls">
                <div class="controls-top">
                    <span id="date-display" class="date-display"></span>
                    <div class="control-button-row">
                        <button id="btn-user-alarm" class="btn btn-warning">호출</button>
                        <button id="btn-edit-mode" class="btn btn-secondary">수정</button>
                        <button id="btn-return-all" class="btn btn-danger">전체반납</button>
                    </div>
                </div>
                <div class="mode-button-row">
                    <button id="btn-mode-self" class="btn btn-mode-self">본인</button>
                    <button id="btn-mode-crew" class="btn btn-secondary">크루</button>
                    <button id="btn-mode-charge" class="btn btn-secondary">충전중</button>
                </div>
            </div>

            <div id="user-incoming-alarm" class="hidden user-alarm-banner">
                <div class="user-alarm-banner-title">직원 호출 알림 (관리자만 확인 가능합니다)</div>
                <div id="user-alarm-list" class="user-alarm-list"></div>
            </div>

            <div id="number-grid" class="grid"></div>
        </div>
    </div>

    <div id="admin-screen" class="screen hidden">
        <header class="admin-header">
            <div class="header-stack">
                <span>TAS Walkie-Talkie 관리자 대시보드</span>
                <span id="admin-branch-badge" class="branch-pill">PUS</span>
            </div>
            <button id="btn-admin-logout" class="btn btn-secondary">로그아웃</button>
        </header>
        <div class="screen-body">
            <div class="admin-section" id="admin-user-sec">
                <h3 id="admin-whitelist-title" class="admin-link-title">직원 계정 관리 (명단 보기)</h3>
                <div id="whitelist-dropdown" class="hidden">
                    <div class="whitelist-title">[등록된 직원 명단]</div>
                    <div id="whitelist-content">명단이 없습니다.</div>
                </div>
                <input type="text" id="admin-target-user" class="input-field" placeholder="직원 이름 입력">
                <div class="action-group">
                    <button id="btn-add-user" class="btn btn-primary">생성</button>
                    <button id="btn-delete-user" class="btn btn-danger">삭제</button>
                    <button id="btn-reset-pw" class="btn btn-warning reset-button">
                        초기화<span id="reset-badge" class="badge"></span>
                    </button>
                    <button id="btn-reset-all-pw" class="btn btn-danger admin-orange">전체초기화</button>
                </div>
            </div>

            <div class="admin-section">
                <h3>실시간 번호판 설정</h3>
                <div class="action-group action-group-top">
                    <button id="btn-toggle-admin-board" class="btn btn-secondary">번호판 팝업 열기</button>
                    <button id="btn-admin-reset-all" class="btn btn-danger">모두 강제 초기화</button>
                </div>

                <div id="admin-board-popup" class="hidden admin-board-popup">
                    <div id="admin-incoming-alarm" class="hidden admin-alarm-banner">
                        <div class="admin-alarm-banner-title">&#128276; 호출 알림 목록</div>
                        <div id="alarm-list" class="admin-alarm-list"></div>
                        <div class="admin-alarm-actions">
                            <button id="btn-dismiss-alarm" class="btn admin-dismiss-btn">전체 끄기</button>
                        </div>
                    </div>
                    <p class="admin-board-guide">번호 박스를 누르면 즉시 강제 취소됩니다.</p>
                    <div id="admin-number-grid" class="grid"></div>
                </div>

                <div class="admin-input-row">
                    <input type="number" id="admin-total-nums" class="input-field" placeholder="최대 번호 개수 (기본 20)">
                    <button id="btn-update-nums" class="btn btn-primary admin-inline-btn">변경</button>
                </div>
                <div class="admin-input-row">
                    <input type="number" id="admin-disable-num" class="input-field" placeholder="사용제한/해제할 번호">
                    <button id="btn-toggle-disable" class="btn btn-secondary admin-inline-btn">상태 변경</button>
                </div>
            </div>

            <div class="admin-section">
                <h3>미반납자 알림</h3>
                <button id="btn-send-alarm" class="btn btn-danger admin-full-btn">반납 촉구 알림 전송</button>
            </div>

            <div class="admin-section">
                <h3>일별 사용 기록 다운로드</h3>
                <div class="admin-input-row">
                    <input type="date" id="export-date" class="input-field admin-date-input">
                    <button id="btn-export-excel" class="btn btn-primary btn-export">추출</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
