<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="W.T">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="W.T">
    <link rel="apple-touch-icon" href="https://ui-avatars.com/api/?name=W+T&background=007aff&color=fff&size=192">
    <link rel="icon" sizes="192x192" href="https://ui-avatars.com/api/?name=W+T&background=007aff&color=fff&size=192">
    <title>W.T 시스템</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
        <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="alarm-overlay">
    <div style="font-size: 60px; margin-bottom: 20px;">⚠️</div>
    <div>일과 종료!<br>번호를 즉시 반납하세요!</div>
    <div style="font-size: 14px; margin-top: 30px; opacity: 0.8;">화면을 터치하면 알람이 꺼집니다</div>
</div>

<div id="app-container">
    <!-- 1. 로그인 화면 -->
    <div id="login-screen" class="screen">
        <div class="login-box">
            <h2 style="color: #007aff; margin-bottom: 30px;">PUS Walkie-Talkie</h2>
            <input type="text" id="login-id" class="input-field" placeholder="ID (이름)">
            <input type="password" id="login-pw" class="input-field" placeholder="Password">
            <button id="btn-login" class="btn btn-primary" style="width: 100%; padding: 16px; font-size: 16px; margin-top: 15px; border-radius: 8px;">로그인</button>
            <button id="btn-user-reset-req" class="btn btn-secondary" style="width: 100%; padding: 12px; margin-top: 10px; border-radius: 8px; background-color: transparent; color: #8e8e93; border: 1px solid #d1d1d6;">비밀번호 초기화 요청</button>
        </div>
    </div>

    <!-- 2. 메인 앱 화면 -->
    <div id="main-screen" class="screen hidden">
        <header>
            <span id="user-greeting">환영합니다</span>
            <button id="btn-logout" class="btn btn-secondary">로그아웃</button>
        </header>
        <div style="padding: 15px 0;">
            <div class="controls">
                <div class="controls-top">
                    <span id="date-display" style="font-weight: bold; color: #555; font-size: 14px;"></span>
                    <div style="display: flex; gap: 6px;">
                        <button id="btn-user-alarm" class="btn btn-warning" style="padding: 8px 12px;">알림</button>
                        <button id="btn-edit-mode" class="btn btn-secondary" style="padding: 8px 12px;">수정</button>
                        <button id="btn-return-all" class="btn btn-danger" style="padding: 8px 12px;">초기화</button>
                    </div>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button id="btn-mode-self" class="btn btn-mode-self" style="flex: 1; padding: 12px 4px; font-size: 14px;">본인</button>
                    <button id="btn-mode-crew" class="btn btn-secondary" style="flex: 1; padding: 12px 4px; font-size: 14px;">크루</button>
                    <button id="btn-mode-charge" class="btn btn-secondary" style="flex: 1; padding: 12px 4px; font-size: 14px;">충전중</button>
                </div>
            </div>
            <!-- 직원용 호출 알림 배너 (읽기 전용, 끄기 불가) -->
            <div id="user-incoming-alarm" class="hidden" style="margin-bottom: 14px; border-radius: 8px; overflow: hidden; border: 1px solid #ff3b30;">
                <div style="background:#ff3b30; color:#fff; font-weight:bold; font-size:13px; padding:6px 10px;">🔔 호출 알림 (관리자만 끌 수 있습니다)</div>
                <div id="user-alarm-list" style="background:#fff3f3; max-height:110px; overflow-y:auto; padding:4px 10px; font-size:13px;"></div>
            </div>
            <div id="number-grid" class="grid"></div>
        </div>
    </div>

    <!-- 3. 관리자 화면 -->
    <div id="admin-screen" class="screen hidden">
        <header style="background-color: #1c1c1e;">
            <span>관리자 대시보드</span>
            <button id="btn-admin-logout" class="btn btn-secondary">로그아웃</button>
        </header>
        <div style="padding: 15px 0;">
            
            <div class="admin-section" id="admin-user-sec">
                <h3 id="admin-whitelist-title" style="cursor: pointer; color: #007aff; display: inline-block;">👥 계정 관리 (명단 보기 ▼)</h3>
                <div id="whitelist-dropdown" class="hidden">
                    <div style="font-weight: bold; margin-bottom: 5px; color: #007aff;">[등록된 직원 명단]</div>
                    <div id="whitelist-content">목록이 없습니다.</div>
                </div>
                <input type="text" id="admin-target-user" class="input-field" placeholder="직원 이름 입력" style="margin-top: 10px;">
                <div class="action-group">
                    <button id="btn-add-user" class="btn btn-primary">생성</button>
                    <button id="btn-delete-user" class="btn btn-danger">삭제</button>
                    <button id="btn-reset-pw" class="btn btn-warning" style="position: relative;">
                        초기화 <span id="reset-badge" class="badge"></span>
                    </button>
                    <button id="btn-reset-all-pw" class="btn btn-danger" style="background-color:#ff9500;">전체초기화</button>
                </div>
            </div>

            <div class="admin-section">
                <h3>🔢 실시간 번호판 설정</h3>
                <div style="display: flex; gap: 8px; margin-bottom: 12px;">
                    <button id="btn-toggle-admin-board" class="btn btn-secondary" style="flex: 1;">번호판 팝업 토글</button>
                    <button id="btn-admin-reset-all" class="btn btn-danger" style="flex: 1;">모두 강제 초기화</button>
                </div>
                
                <div id="admin-board-popup" class="hidden" style="margin-bottom: 15px; border: 2px dashed #007aff; padding: 10px; border-radius: 8px; background-color: #fff;">
                    <!-- 호출 알림 목록: 여러 건 누적 표시 -->
                    <div id="admin-incoming-alarm" class="hidden" style="margin-bottom: 10px; border-radius: 8px; overflow: hidden; border: 1px solid #ff3b30;">
                        <div style="background:#ff3b30; color:#fff; font-weight:bold; font-size:13px; padding:6px 10px;">&#128276; 호출 알림 목록</div>
                        <div id="alarm-list" style="background:#fff3f3; max-height:130px; overflow-y:auto; padding:4px 10px; font-size:13px;"></div>
                        <div style="background:#fff3f3; padding:4px 10px; text-align:right; border-top:1px solid #ffd0d0;">
                            <button id="btn-dismiss-alarm" class="btn" style="padding:3px 12px; font-size:12px; background-color:#8e8e93; color:#fff; border-radius:4px;">전체 끄기</button>
                        </div>
                    </div>
                    <p style="font-size: 12px; color: #ff3b30; margin-top: 0; margin-bottom: 10px; text-align: center; font-weight: bold;">※ 박스를 클릭하면 즉시 강제 취소됩니다.</p>
                    <div id="admin-number-grid" class="grid"></div>
                </div>

                <div style="display: flex; gap: 8px;">
                    <input type="number" id="admin-total-nums" class="input-field" placeholder="최대 번호 개수 (기본 20)">
                    <button id="btn-update-nums" class="btn btn-primary" style="white-space: nowrap;">변경</button>
                </div>
                <div style="display: flex; gap: 8px; margin-top: 8px;">
                    <input type="number" id="admin-disable-num" class="input-field" placeholder="제한/해제할 번호">
                    <button id="btn-toggle-disable" class="btn btn-secondary" style="white-space: nowrap;">상태 토글</button>
                </div>
            </div>

            <div class="admin-section">
                <h3>🔔 미반납자 알람</h3>
                <button id="btn-send-alarm" class="btn btn-danger" style="width: 100%; padding: 12px;">반납 촉구 알람 전송</button>
            </div>

            <div class="admin-section">
                <h3>📊 일별 엑셀 다운로드</h3>
                <div style="display: flex; gap: 8px;">
                    <input type="date" id="export-date" class="input-field" style="margin: 0;">
                    <button id="btn-export-excel" class="btn btn-primary" style="background-color: #34c759; white-space: nowrap;">추출</button>
                </div>
            </div>

        </div>
    </div>
</div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
